<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BUTTONS</title>
    <link rel="stylesheet" href="../null.css" />
    <link rel="stylesheet" href="buttons.css" />
  </head>
  <body class="page">
    <div class="wrapper">
      <main class="main">
        <section class="main__section">
          <h1 class="main__title">background</h1>
          <div class="main__items">
            <button class="button fill-down"><span>Explore more</span></button>
            <button class="button fill-center">
              <span>Explore more</span>
            </button>
            <button class="button fill-right">
              <span>Explore more</span>
            </button>
            <button class="button rain-drop">
              <span>Explore more</span>
            </button>
            <button class="button gradient">
              <span>Explore more</span>
            </button>
            <button class="button waves">
              <span>Explore more</span>
              <div class="waves__blobs">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
              </div>
            </button>
          </div>
        </section>
        <section class="main__section">
          <h1 class="main__title">border</h1>
          <div class="main__items">
            <button class="button border-flip">
              <span>Explore more</span>
            </button>
            <button class="button shine">
              <span>Explore more</span>
            </button>
          </div>
        </section>
        <section class="main__section">
          <h1 class="main__title">arrow</h1>
          <div class="main__items">
            <button class="button arrow-shine">
              <span>Explore more</span>
              <svg fill="currentColor" viewBox="0 0 24 24" class="icon">
                <path
                  clip-rule="evenodd"
                  d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm4.28 10.28a.75.75 0 000-1.06l-3-3a.75.75 0 10-1.06 1.06l1.72 1.72H8.25a.75.75 0 000 1.5h5.69l-1.72 1.72a.75.75 0 101.06 1.06l3-3z"
                  fill-rule="evenodd"
                ></path>
              </svg>
            </button>
            <button class="button arrow-move">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="arr-2"
                viewBox="0 0 24 24"
              >
                <path
                  d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
                ></path>
              </svg>
              <span class="text">Explore more</span>
              <span class="circle"></span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="arr-1"
                viewBox="0 0 24 24"
              >
                <path
                  d="M16.1716 10.9999L10.8076 5.63589L12.2218 4.22168L20 11.9999L12.2218 19.778L10.8076 18.3638L16.1716 12.9999H4V10.9999H16.1716Z"
                ></path>
              </svg>
            </button>
            <button class="slider-button">
              <div class="slider-button-box">
                <span class="slider-button-elem">
                  <svg
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                    class="arrow-icon"
                  >
                    <path
                      fill="black"
                      d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
                    ></path>
                  </svg>
                </span>
                <span class="slider-button-elem">
                  <svg
                    fill="black"
                    viewBox="0 0  24 24"
                    xmlns="http://www.w3.org/2000/svg"
                    class="arrow-icon"
                  >
                    <path
                      d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
                    ></path>
                    w
                  </svg>
                </span>
              </div>
            </button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src=""></script>
  </body>
</html>
