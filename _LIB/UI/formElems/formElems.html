<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORM ELEMS</title>
    <link rel="stylesheet" href="../null.css" />
    <link rel="stylesheet" href="./formElems.css" />
  </head>
  <body class="page">
    <div class="wrapper">
      <main class="main">
        <section class="main__section">
          <h1 class="main__title">inputs</h1>
          <div class="main__items">
            <div class="form-elem">
              <input
                placeholder="type it"
                class="input shadow-rotate"
                name="text"
                type="text"
              />
            </div>
            <div class="form-elem move-placeholder">
              <input required="" type="text" class="input" />
              <span>Placeholder Placeholder</span>
            </div>
            <div class="form-elem move-placeholder-border">
              <input type="text" required="" autocomplete="off" class="input" />
              <label for="name">Name</label>
            </div>
            <div class="form-elem move-placeholder-line">
              <input type="text" required="" autocomplete="off" class="input" />
              <label>Name</label>
              <span></span>
            </div>
          </div>
        </section>
        <section class="main__section">
          <h1 class="main__title">checkboxes</h1>
          <div class="main__items">
            <div class="form__elem">
              <input type="checkbox" class="ui-checkbox" />
            </div>
            <div class="form__elem jelly-checkbox">
              <input checked="" type="checkbox" id="cbx" class="checkbox" />
              <label for="cbx" class="label"></label>
            </div>
            <div class="wipe-checkbox">
              <label class="container">
                <input type="checkbox" />
                <div class="checkmark"></div>
              </label>
            </div>
          </div>
        </section>
        <section class="main__section">
          <h1 class="main__title">Radio</h1>
          <div class="main__items">
            <div class="move-radio">
              <input name="radio" type="radio" class="radio" checked="" />
              <input name="radio" type="radio" class="radio" />
              <input name="radio" type="radio" class="radio" />
            </div>
            <div class="pulse-radio">
              <label class="pulse-radio__label">
                <input
                  type="radio"
                  id="value-1"
                  checked=""
                  name="value-radio"
                  value="value-1"
                />
                <p class="pulse-radio__text">Designer</p>
              </label>
              <label class="pulse-radio__label">
                <input
                  type="radio"
                  id="value-2"
                  name="value-radio"
                  value="value-2"
                />
                <p class="pulse-radio__text">Student</p>
              </label>
              <label class="pulse-radio__label">
                <input
                  type="radio"
                  id="value-3"
                  name="value-radio"
                  value="value-3"
                />
                <p class="pulse-radio__text">Teacher</p>
              </label>
            </div>
          </div>
        </section>
        <section class="main__section">
          <h1 class="main__title">rating</h1>
          <div class="main__items">
            <div class="rating">
              <input value="5" name="rate" id="star5" type="radio" />
              <label title="text" for="star5"></label>
              <input value="4" name="rate" id="star4" type="radio" />
              <label title="text" for="star4"></label>
              <input value="3" name="rate" id="star3" type="radio" checked="" />
              <label title="text" for="star3"></label>
              <input value="2" name="rate" id="star2" type="radio" />
              <label title="text" for="star2"></label>
              <input value="1" name="rate" id="star1" type="radio" />
              <label title="text" for="star1"></label>
            </div>
            <div class="star-rating">
              <input value="5" name="star-rating" id="str5" type="radio" />
              <label for="str5"></label>
              <input value="4" name="star-rating" id="str4" type="radio" />
              <label for="str4"></label>
              <input value="3" name="star-rating" id="str3" type="radio" />
              <label for="str3"></label>
              <input value="2" name="star-rating" id="str2" type="radio" />
              <label for="str2"></label>
              <input value="1" name="star-rating" id="str1" type="radio" />
              <label for="str1"></label>
            </div>
          </div>
        </section>
        <section class="main__section">
          <h1 class="main__title">select</h1>
          <div class="main__items">
            <div class="select">
              <select class="select__native" name="social">
                <option value="instagram">Instagram</option>
                <option value="linkedin">Linkedin</option>
                <option value="facebook">Facebook</option>
                <option value="twitter">Twitter</option>
              </select>

              <button class="select__btn" type="button">
                <span class="select__btn-text">Instagram</span>
              </button>

              <ul class="select__options">
                <li class="select__option" data-value="instagram">
                  <span class="select__option-text">Instagram</span>
                </li>

                <li class="select__option" data-value="linkedin">
                  <span class="select__option-text">Linkedin</span>
                </li>

                <li class="select__option" data-value="facebook">
                  <span class="select__option-text">Facebook</span>
                </li>

                <li class="select__option" data-value="twitter">
                  <span class="select__option-text">Twitter</span>
                </li>
              </ul>
            </div>

            <div class="select-menu">
              <div
                class="selected"
                data-default="All"
                data-one="option-1"
                data-two="option-2"
                data-three="option-3"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  height="1em"
                  viewBox="0 0 512 512"
                  class="arrow"
                >
                  <path
                    d="M233.4 406.6c12.5 12.5 32.8 12.5 45.3 0l192-192c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L256 338.7 86.6 169.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l192 192z"
                  ></path>
                </svg>
              </div>
              <div class="options">
                <div title="all">
                  <input id="all" name="option" type="radio" checked="" />
                  <label class="option" for="all" data-txt="All"></label>
                </div>
                <div title="option-1">
                  <input id="option-1" name="option" type="radio" />
                  <label
                    class="option"
                    for="option-1"
                    data-txt="option-1"
                  ></label>
                </div>
                <div title="option-2">
                  <input id="option-2" name="option" type="radio" />
                  <label
                    class="option"
                    for="option-2"
                    data-txt="option-2"
                  ></label>
                </div>
                <div title="option-3">
                  <input id="option-3" name="option" type="radio" />
                  <label
                    class="option"
                    for="option-3"
                    data-txt="option-3"
                  ></label>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="formElems.js"></script>
  </body>
</html>
