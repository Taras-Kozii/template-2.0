<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HOVER LINKS</title>
    <link rel="stylesheet" href="../null.css" />
    <link rel="stylesheet" href="links.css" />
  </head>
  <body class="page">
    <div class="wrapper">
      <main class="main">
        <section class="main__section">
          <h1 class="main__title">underline</h1>
          <div class="links">
            <a href="#" class="link neon-underline"
              ><span>Explore more</span>
            </a>
            <a href="#" class="link underline-hidden"
              ><span>Explore more</span>
            </a>
            <a href="#" class="link underline-show-center"
              ><span>Explore more</span>
            </a>
            <a href="#" class="link underline-show-left-right"
              ><span>Explore more</span>
            </a>
            <a href="#" class="link underline-hidden-center"
              ><span>Explore more</span>
            </a>
          </div>
        </section>
        <section class="main__section">
          <h1 class="main__title">color</h1>
          <div class="links">
            <a href="#" class="link color-change">
              <span>Explore more</span>
            </a>
            <a href="#" class="link color-change-line">
              <span>Explore more</span>
            </a>
            <a href="#" class="link gradient-link">
              <span>Explore more</span>
            </a>
            <a href="#" class="link wave-bg">
              <span>Explore more</span>
              <span>Explore more</span>
            </a>
          </div>
        </section>
        <section class="main__section">
          <h1 class="main__title">bars</h1>
          <div class="links">
            <a href="#" class="link two-lines">
              <span>Explore more</span>
            </a>
            <a href="#" class="link show-bars"><span>Explore more</span> </a>
          </div>
        </section>
        <section class="main__section">
          <h1 class="main__title">arrow</h1>
          <div class="links">
            <a href="#" class="link color-change-arrow">
              <span>Explore more</span>
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="4"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M14 5l7 7m0 0l-7 7m7-7H3"
                ></path>
              </svg>
            </a>
            <a href="#" class="link show-mask">
              <span>Explore more</span>
            </a>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
