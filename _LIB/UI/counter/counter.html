<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COUNTERS</title>
    <link rel="stylesheet" href="../null.css" />
    <link rel="stylesheet" href="./counter.css" />
  </head>
  <body class="page">
    <div class="wrapper">
      <main class="main">
        <section class="main__section">
          <h1 class="main__title">DIGITS</h1>
          <div class="main__content">
            <div class="digits" data-counter>88</div>
            <div class="digits"><span data-counter>40</span>+</div>
            <div class="digits" data-counter>05</div>
            <div class="digits"><span data-counter>140</span>+</div>
          </div>
          <div class="main__content">
            <div class="digits" data-counter>10</div>
            <div class="digits"><span data-counter>1000</span>+</div>
            <div class="digits" data-counter>-50</div>
            <div class="digits"><span data-counter>99</span>+</div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="counter.js"></script>
  </body>
</html>
